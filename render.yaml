services:
  - type: web
    name: stocksense-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://stocksense-frontend.onrender.com

  - type: web
    name: stocksense-frontend
    runtime: static
    repo: https://github.com/INFKIRITO/StockSense-frontend.git
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stocksense-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: stocksense-db
    region: oregon
    plan: free
